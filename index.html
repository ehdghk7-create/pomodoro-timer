<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1F5F3B">
  <meta name="description" content="드래그해서 시간을 맞추는 비주얼 뽀모도로 타이머">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Pomodoro">
  <title>Pomodoro Timer</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body data-mode="focus">
  <main id="clockSlot" class="stage">
    <div id="clockWrap" class="clock-wrap" data-mode="focus" data-lamp="off">
      <div class="clock">
        <span class="lamp" aria-hidden="true"><span class="lamp-glass"></span></span>
        <button id="brand" class="brand" aria-label="설정 열기" title="설정">pomo.</button>
        <button id="knobHit" class="knob-hit" aria-label="노브: 누르면 시작/정지, 잡고 돌리면 시간 설정"></button>
        <svg id="dial" class="dial" viewBox="0 0 400 400" role="img"
             aria-label="남은 시간" aria-valuemin="0" aria-valuemax="60">
          <defs>
            <!-- recessed bezel: shadow on top, light catching the bottom lip -->
            <linearGradient id="gBezel" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#A89B7C"/>
              <stop offset=".45" stop-color="#D6CBB1"/>
              <stop offset="1" stop-color="#FFFDF6"/>
            </linearGradient>
            <radialGradient id="gFace" cx="50%" cy="46%" r="55%">
              <stop offset="0" stop-color="#FFFFFF"/>
              <stop offset=".75" stop-color="#FAF8F2"/>
              <stop offset="1" stop-color="#EEEAE0"/>
            </radialGradient>
            <!-- inner shadow cast by the bezel onto the face -->
            <radialGradient id="gFaceShade" cx="50%" cy="56%" r="52%">
              <stop offset=".86" stop-color="#000" stop-opacity="0"/>
              <stop offset="1" stop-color="#000" stop-opacity=".22"/>
            </radialGradient>
            <radialGradient id="gSectorShine" cx="50%" cy="50%" r="50%">
              <stop offset="0" stop-color="#fff" stop-opacity=".10"/>
              <stop offset=".7" stop-color="#fff" stop-opacity="0"/>
              <stop offset="1" stop-color="#000" stop-opacity=".12"/>
            </radialGradient>
            <!-- acrylic cover reflection -->
            <linearGradient id="gGlass" x1=".15" y1="0" x2=".7" y2=".85">
              <stop offset="0" stop-color="#fff" stop-opacity=".55"/>
              <stop offset=".35" stop-color="#fff" stop-opacity=".12"/>
              <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
            </linearGradient>
            <radialGradient id="gKnobCap" cx="38%" cy="32%" r="75%">
              <stop offset="0" stop-color="#FFE3B0"/>
              <stop offset=".35" stop-color="#F6BD63"/>
              <stop offset=".8" stop-color="#DE9634"/>
              <stop offset="1" stop-color="#B8751E"/>
            </radialGradient>
            <radialGradient id="gKnobDish" cx="60%" cy="65%" r="70%">
              <stop offset="0" stop-color="#F8C677"/>
              <stop offset="1" stop-color="#E9A445"/>
            </radialGradient>
            <linearGradient id="gKnurl" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#F7C67A"/>
              <stop offset="1" stop-color="#A9681A"/>
            </linearGradient>
            <filter id="fBlur3" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
            <filter id="fBlur1" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1"/></filter>
          </defs>

          <circle cx="200" cy="200" r="198" fill="url(#gBezel)"/>
          <circle class="face" cx="200" cy="200" r="190" fill="url(#gFace)"/>
          <path id="sector" class="sector" d=""/>
          <path id="sectorShine" d="" fill="url(#gSectorShine)" pointer-events="none"/>
          <circle cx="200" cy="200" r="190" fill="url(#gFaceShade)" pointer-events="none"/>
          <g id="ticks" class="ticks"></g>
          <g id="labels" class="labels"></g>
          <text class="motto" x="200" y="270" text-anchor="middle">Great things</text>
          <text class="motto" x="200" y="292" text-anchor="middle">take time.</text>
          <text id="digital" class="digital" x="200" y="326" text-anchor="middle">25:00</text>
          <clipPath id="sectorClip"><path id="sectorClipPath" d=""/></clipPath>
          <g class="on-sector" clip-path="url(#sectorClip)" aria-hidden="true">
            <text class="motto" x="200" y="270" text-anchor="middle">Great things</text>
            <text class="motto" x="200" y="292" text-anchor="middle">take time.</text>
            <text id="digital2" class="digital" x="200" y="326" text-anchor="middle">25:00</text>
          </g>

          <!-- knob: contact shadow, knurled skirt, domed cap, dished top, indicator groove -->
          <ellipse cx="204" cy="209" rx="31" ry="30" fill="#000" opacity=".35" filter="url(#fBlur3)" pointer-events="none"/>
          <g id="knob" class="knob">
            <circle cx="200" cy="200" r="31" fill="url(#gKnurl)"/>
            <circle cx="200" cy="200" r="29.5" fill="none" stroke="#9A5E14" stroke-width="3" stroke-dasharray="1.3 1.5" opacity=".75"/>
            <circle cx="200" cy="200" r="26" fill="url(#gKnobCap)"/>
            <circle cx="200" cy="200" r="25.5" fill="none" stroke="#FFF1D6" stroke-opacity=".6" stroke-width="1"/>
            <circle cx="200" cy="200" r="19" fill="url(#gKnobDish)"/>
            <circle cx="200" cy="200" r="19" fill="none" stroke="#C5832B" stroke-opacity=".45" stroke-width="1"/>
            <g id="knobLine">
              <line x1="200" y1="199" x2="200" y2="178" stroke="#A9681A" stroke-width="3.2" stroke-linecap="round"/>
              <line x1="200.8" y1="199" x2="200.8" y2="178" stroke="#FFF3DC" stroke-width="1.2" stroke-linecap="round" opacity=".8"/>
            </g>
          </g>

          <!-- acrylic cover on top of everything (ignores the mouse) -->
          <g class="glass" pointer-events="none">
            <path d="M200,10 A190,190 0 0 0 31,286 C 90,180 170,90 330,60 A190,190 0 0 0 200,10Z" fill="url(#gGlass)"/>
            <path d="M74,72 A178,178 0 0 1 200,22" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".7" filter="url(#fBlur1)"/>
            <circle cx="200" cy="200" r="190" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="1"/>
          </g>
        </svg>
      </div>
    </div>
    <p id="pipNotice" class="pip-notice" hidden>타이머가 ‘항상 위’ 창에 떠 있어요.<br>창을 닫으면 여기로 돌아옵니다.</p>
  </main>

  <dialog id="settings" class="sheet" aria-label="설정">
    <div class="sheet-head">
      <h2>설정</h2>
      <button id="btnClose" class="icon-btn" aria-label="닫기">
        <svg viewBox="0 0 24 24" class="ico"><path d="M6.4 5 5 6.4 10.6 12 5 17.6 6.4 19l5.6-5.6 5.6 5.6 1.4-1.4-5.6-5.6L19 6.4 17.6 5 12 10.6z"/></svg>
      </button>
    </div>

    <nav class="modes" role="tablist" aria-label="모드">
      <button class="mode" data-mode="focus" role="tab">집중</button>
      <button class="mode" data-mode="short" role="tab">짧은 휴식</button>
      <button class="mode" data-mode="long" role="tab">긴 휴식</button>
    </nav>

    <div class="actions">
      <button id="btnStart" class="act primary">
        <svg viewBox="0 0 24 24" class="ico ico-play"><path d="M8 5v14l11-7z"/></svg>
        <svg viewBox="0 0 24 24" class="ico ico-pause"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
        <span id="startLabel">시작</span>
      </button>
      <button id="btnReset" class="act">
        <svg viewBox="0 0 24 24" class="ico"><path d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg>
        <span>초기화</span>
      </button>
      <button id="btnPin" class="act">
        <svg viewBox="0 0 24 24" class="ico"><path d="M16 3l5 5-3 1-4 4 1 5-2 2-4-4-5 5-1-1 5-5-4-4 2-2 5 1 4-4z"/></svg>
        <span>항상 위</span>
      </button>
    </div>

    <p class="session">오늘 완료 <b id="todayCount">0</b>개 <span id="cycleDots" class="dots"></span></p>

    <div id="winGroup" class="group win-group" hidden>
      <div class="win-row">
        <span class="label">시계 크기</span>
        <div class="seg">
          <button class="size" data-size="260">작게</button>
          <button class="size" data-size="380">보통</button>
          <button class="size" data-size="520">크게</button>
        </div>
      </div>
      <div class="row">
        <button id="btnMin" class="small">최소화</button>
        <button id="btnQuit" class="small danger">종료</button>
      </div>
    </div>

    <div class="group">
      <div class="grid">
        <label>집중 (분)<input type="number" id="setFocus" min="1" max="60"></label>
        <label>짧은 휴식 (분)<input type="number" id="setShort" min="1" max="60"></label>
        <label>긴 휴식 (분)<input type="number" id="setLong" min="1" max="60"></label>
        <label>긴 휴식 간격 (회)<input type="number" id="setEvery" min="2" max="10"></label>
      </div>
      <label class="check"><input type="checkbox" id="setAuto"> 다음 세션 자동 시작</label>
      <label class="check"><input type="checkbox" id="setSound"> 알람 소리</label>
      <label class="range">볼륨<input type="range" id="setVolume" min="0" max="1" step="0.05"></label>
      <div class="row">
        <button id="btnTest" class="small">소리 테스트</button>
        <button id="btnInstall" class="small" hidden>앱으로 설치</button>
      </div>
    </div>
    <p class="hint">노브를 잡고 돌리기: 시간 설정 · 노브 짧게 누르기: 시작/정지<br><span class="desk-only">노브 말고 시계 아무 곳이나 잡고 끌면 창 이동<br></span>단축키 Space 시작/정지 · R 초기화 · ↑↓ 1분 · P 항상 위 · S 설정</p>
  </dialog>

  <div id="toast" class="toast" role="status" hidden></div>
  <script src="app.js"></script>
</body>
</html>
